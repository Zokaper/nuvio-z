[package]
name = "nuvioz-usb-probe"
version = "0.5.2"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Intentionally independent: experimental dependencies cannot change the desktop/iOS lockfile.
[workspace]
members = ["vendor/rusbmux"]
exclude = ["vendor/isideload"]
resolver = "2"

[lib]
name = "nuvioz_usb_probe"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same device/signing pins as ../../Cargo.toml; this workspace does not change production dependencies.
idevice = { version = "=0.1.68", default-features = false, features = ["tcp", "rustls", "ring", "pair", "amfi", "house_arrest", "remote_pairing", "installation_proxy", "afc"] }
rusbmux = { path = "vendor/rusbmux", default-features = false, features = ["nusb"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
plist = "1"
isideload = { path = "vendor/isideload", version = "=0.4.6", default-features = false, features = ["install", "tokio-mt"] }
rootcause = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "rustls-no-provider", "http2", "charset", "system-proxy"] }
sha2 = "0.11"
zeroize = "1"
isideload-vfs = "=0.0.1"
jni = "=0.21.1"

[target.'cfg(target_os = "android")'.dependencies]
jni22 = { package = "jni", version = "=0.22.4" }
rustls-platform-verifier = "=0.7.1"
nusb = { version = "=0.2.8", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }

[dev-dependencies]
rsa = "=0.9.10"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "unwind"
