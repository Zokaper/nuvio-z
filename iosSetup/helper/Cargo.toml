[package]
name = "nuvioz-device-helper"
version = "0.0.1"
edition = "2021"
description = "Spike: USB device probes for the Nuvio Z iOS Setup assistant"

[dependencies]
# Exact pin on purpose: the helper must not drift with upstream releases.
idevice = { version = "=0.1.68", default-features = false, features = ["usbmuxd", "amfi", "core_device_proxy", "afc", "house_arrest", "installation_proxy", "misagent", "tcp", "rustls", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
plist = "1"
