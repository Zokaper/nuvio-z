name: iOS Installer release

# Builds Installer 3 (iosInstaller/, Tauri + Rust) for Windows and universal macOS, then publishes from main: a versioned
# prerelease ios-setup-v<version> plus the rolling ios-setup-vlatest links the README shares. Installer 3 takes
# over those links from the retired Kotlin iOS Setup (PLAN-nuvio-z-self-signing.md, "Release decisions").
# Run by hand, or called by ios-installer-auto.yml after a reviewed signing-crate update.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish (main only). Off builds and uploads the zip as an artifact.'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'Commit or branch to build.'
        type: string
        required: true
      publish:
        type: boolean
        default: true
      notes:
        description: 'Extra release notes (markdown).'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build for Windows
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: iosInstaller

      - name: Version
        id: version
        shell: bash
        working-directory: iosInstaller
        run: |
          version=$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Installer ${version} at $(git rev-parse --short HEAD)"

      - name: Core tests
        working-directory: iosInstaller
        run: cargo test -p nuvioz-installer-core

      - name: Build the installer
        working-directory: iosInstaller
        run: cargo build --release -p nuvioz-ios-installer

      - name: Package
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory -Force package
          Copy-Item iosInstaller/target/release/nuvioz-ios-installer.exe (Join-Path $dir 'Nuvio Z iOS Installer.exe')
          Compress-Archive -Path (Join-Path $dir '*') -DestinationPath Nuvio-Z-iOS-Setup-Windows-x64.zip
          Get-Item Nuvio-Z-iOS-Setup-Windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: ios-installer-windows
          path: Nuvio-Z-iOS-Setup-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build for Mac
    uses: ./.github/workflows/ios-installer-macos.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  publish:
    name: Publish
    needs: [build, macos]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      SHA: ${{ needs.build.outputs.sha }}
      NOTES: ${{ inputs.notes }}
      ALIAS: ios-setup-vlatest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The rolling links are what people download: only what is on main may reach them.
      - name: Only from main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "::error::${SHA} is not on main; publishing is for main only."
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          name: ios-installer-windows
          path: assets

      - uses: actions/download-artifact@v7
        with:
          name: ios-installer-macos
          path: assets

      - name: Publish
        run: |
          set -euo pipefail
          tag="ios-setup-v${VERSION}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::${tag} already exists; bump the version in iosInstaller/Cargo.toml and app/tauri.conf.json."
            exit 1
          fi
          cd assets
          unzip -l Nuvio-Z-iOS-Setup-Windows-x64.zip | grep -q 'Nuvio Z iOS Installer.exe'
          unzip -l Nuvio-Z-iOS-Setup-macOS.zip | grep -q 'Nuvio Z iOS Installer.app/Contents/Info.plist'
          sha256sum Nuvio-Z-iOS-Setup-Windows-x64.zip | tee SHA256SUMS-Windows.txt
          sha256sum Nuvio-Z-iOS-Setup-Windows-x64.zip Nuvio-Z-iOS-Setup-macOS.zip > SHA256SUMS.txt
          body="Nuvio Z iOS Installer ${VERSION} for Windows and Mac (Intel and Apple Silicon, macOS 11+). Installs Nuvio Z on an iPhone, signed with your own Apple Account; Nuvio Z then keeps itself signed.

          Mac: unzip, move the app to Applications, and open it. This build is not notarized; if macOS blocks it, use System Settings > Privacy & Security > Open Anyway. The zip includes instructions.

          ${NOTES}"
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --target "${SHA}" \
            --title "Nuvio Z iOS Installer ${VERSION}" --notes "${body}" --prerelease --latest=false \
            Nuvio-Z-iOS-Setup-Windows-x64.zip Nuvio-Z-iOS-Setup-macOS.zip SHA256SUMS-Windows.txt SHA256SUMS.txt
          if gh release view "${ALIAS}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${ALIAS}" --repo "${GITHUB_REPOSITORY}" --prerelease --latest=false \
              --notes "${body}"
          else
            gh release create "${ALIAS}" --repo "${GITHUB_REPOSITORY}" --target "${SHA}" --prerelease --latest=false \
              --title "Nuvio Z iOS Installer (latest)" --notes "${body}"
          fi
          gh release upload "${ALIAS}" --repo "${GITHUB_REPOSITORY}" --clobber \
            Nuvio-Z-iOS-Setup-Windows-x64.zip Nuvio-Z-iOS-Setup-macOS.zip SHA256SUMS-Windows.txt SHA256SUMS.txt
          echo "Published ${tag} and refreshed ${ALIAS}."
