name: Publish SideStore landing page

# Serves distribution/sidestore/add/ at https://zokaper.github.io/nuvio-z/sidestore/add/ so the iOS
# Setup assistant's QR code can be an ordinary https link (the iPhone camera ignores most custom schemes).
# One-time repository setting required: Settings -> Pages -> Source: "GitHub Actions".
# The setup assistant checks the page is live before using it and falls back to the raw sidestore:// link.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'distribution/sidestore/add/**'
      - '.github/workflows/sidestore-landing.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sidestore-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Stage the site
        run: |
          mkdir -p _site/sidestore/add
          cp distribution/sidestore/add/index.html _site/sidestore/add/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
