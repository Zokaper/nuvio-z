name: Debug release

# Publishes an Android debug APK and iOS Debug unsigned IPA to the debug update channel.
#
# The channel is GitHub **prereleases** tagged `debug-v*`. The stable updater
# discards prereleases, so the two lines cannot see each other and the release
# flow is untouched - see "The debug update line" in STATUS.md.
#
# Android: package `com.nuvio.app.z.debug`, signed with committed debug keystore.
# iOS: bundle `com.nuvio.app.z.debug`, display name `Nuvio Z Debug`, unsigned IPA for SideStore.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve debug version
    runs-on: ubuntu-latest
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      debug_build: ${{ steps.version.outputs.debug_build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      project_version: ${{ steps.version.outputs.project_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Resolve debug version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config=iosApp/Configuration/Version.xcconfig
          debug_config=iosApp/Configuration/DebugVersion.xcconfig
          read_value() {
            sed -nE "s/^[[:space:]]*$2[[:space:]]*=[[:space:]]*([^[:space:]#]+).*/\1/p" "$1" | head -1
          }
          marketing="$(read_value "${config}" MARKETING_VERSION)"
          debug_build="$(read_value "${debug_config}" DEBUG_BUILD)"
          project="$(read_value "${config}" CURRENT_PROJECT_VERSION)"
          if [[ -z "${marketing}" || -z "${debug_build}" || -z "${project}" ]]; then
            echo "::error::Could not read MARKETING_VERSION / DEBUG_BUILD / CURRENT_PROJECT_VERSION"
            exit 1
          fi

          version="${marketing}.${debug_build}"
          tag="debug-v${version}"
          echo "marketing_version=${marketing}" >> "${GITHUB_OUTPUT}"
          echo "debug_build=${debug_build}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "project_version=${project}" >> "${GITHUB_OUTPUT}"

          echo "Publishing ${tag} (expected Android versionCode $((project * 1000 + debug_build)))"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::${tag} already exists. Bump DEBUG_BUILD in ${debug_config} and dispatch again."
            exit 1
          fi

  android_debug:
    name: Build Android debug APK
    needs: prepare
    runs-on: ubuntu-latest
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cap Gradle memory for hosted runners
        run: |
          mkdir -p "${HOME}/.gradle"
          {
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
            echo 'kotlin.daemon.jvmargs=-Xmx3g'
          } >> "${HOME}/.gradle/gradle.properties"

      - name: Configure runtime properties
        run: |
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then
            echo "::warning::NUVIO_LOCAL_PROPERTIES_BASE64 is not set; building without backend configuration."
            : > local.properties
            exit 0
          fi

          normalise_b64() {
            printf '%s' "$1" | tr '_-' '/+' | LC_ALL=C tr -cd 'A-Za-z0-9+/='
          }
          looks_like_properties() {
            printf '%s' "$1" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=' \
              && printf '%s' "$1" | LC_ALL=C grep -q '[:.]'
          }
          decode_text_secret() {
            local name="$1" raw="$2" out="$3" cleaned
            if looks_like_properties "${raw}"; then
              echo "::warning::${name} is not base64; storing it as literal file content."
              printf '%s\n' "${raw}" > "${out}"
            else
              cleaned="$(normalise_b64 "${raw}")"
              echo "${name}: ${#raw} chars raw, ${#cleaned} base64 characters after cleaning"
              printf '%s' "${cleaned}" | base64 --decode > "${out}"
            fi
            if ! grep -Eq '^[A-Za-z_][A-Za-z0-9_]*=.' "${out}"; then
              echo "${name} did not yield a properties file." >&2
              exit 1
            fi
          }

          decode_text_secret LOCAL_PROPERTIES_BASE64 "${LOCAL_PROPERTIES_BASE64}" local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD))[[:space:]]*=/d' local.properties

      - name: Run Android host tests
        run: |
          set -o pipefail
          ./gradlew :composeApp:testAndroidHostTest --console=plain 2>&1 | tee build.log || {
            echo "::error::Android host tests failed"
            grep -E '^e: ' build.log | head -60
            exit 1
          }

      - name: Guard the Android update channel (full distribution)
        run: |
          set -o pipefail
          ./gradlew :composeApp:testAndroidHostTest -Pnuvio.android.distribution=full --tests 'com.nuvio.app.features.updater.AndroidUpdateChannelTest' --console=plain 2>&1 | tee build.log || {
            echo "::error::The Android debug/stable update channel wiring is broken"
            grep -E '^e: ' build.log | head -60
            exit 1
          }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-release-test-reports-${{ github.sha }}
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleFullDebug --console=plain 2>&1 | tee build.log || {
            echo "::error::Debug APK build failed"
            grep -E '^e: ' build.log | head -60
            exit 1
          }

      - name: Identify and stage Android APK
        run: |
          set -euo pipefail
          apk="$(find androidApp/build/outputs/apk/full/debug -name '*.apk' | head -1)"
          if [[ -z "${apk}" ]]; then
            echo "::error::No debug APK was produced"
            exit 1
          fi

          aapt="$(find "${ANDROID_HOME}/build-tools" -name aapt2 | sort | tail -1 || true)"
          if [[ -n "${aapt}" ]]; then
            "${aapt}" dump badging "${apk}" | grep -E "^package:" || true
          fi

          mkdir -p debug-artifacts
          cp "${apk}" debug-artifacts/androidApp-full-debug.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-debug-android
          path: debug-artifacts/androidApp-full-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios_debug:
    name: Build iOS Debug unsigned IPA
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NUVIO_GRADLE_JVMARGS: -Xmx3g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4g
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      IOS_CONFIGURATION: Debug
      IOS_IPA_NAME: Nuvio-Z-iOS-${{ needs.prepare.outputs.marketing_version }}-${{ needs.prepare.outputs.debug_build }}-debug-unsigned.ipa

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Konan dependencies
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Configure and build iOS Debug unsigned IPA
        run: |
          if [[ -n "${RELEASE_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${RELEASE_PROPERTIES_BASE64}" | tr '_-' '/+' | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 --decode > local.properties
            sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD))[[:space:]]*=/d' local.properties
          else
            : > local.properties
          fi
          ./scripts/prepare-ios-dependencies.sh
          ./scripts/build-ios-ipa.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.debug_build }}"

      - name: Upload iOS Debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-debug-ios
          path: build/ios-ipa/${{ env.IOS_IPA_NAME }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to debug channel
    needs: [prepare, android_debug, ios_debug]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download Android artifact
        uses: actions/download-artifact@v7
        with:
          name: nuvio-debug-android
          path: release-assets

      - name: Download iOS artifact
        uses: actions/download-artifact@v7
        with:
          name: nuvio-debug-ios
          path: release-assets

      - name: Compute checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS-Debug.txt
          cat SHA256SUMS-Debug.txt

      - name: Publish GitHub prerelease
        run: |
          set -euo pipefail
          ipa_name="Nuvio-Z-iOS-${{ needs.prepare.outputs.marketing_version }}-${{ needs.prepare.outputs.debug_build }}-debug-unsigned.ipa"
          gh release create "${{ needs.prepare.outputs.tag }}" \
            release-assets/androidApp-full-debug.apk \
            "release-assets/${ipa_name}" \
            release-assets/SHA256SUMS-Debug.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Debug ${{ needs.prepare.outputs.version }}" \
            --prerelease \
            --notes "Debug build from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`.

          Contains:
          - Android Debug APK (\`androidApp-full-debug.apk\`, package \`com.nuvio.app.z.debug\`)
          - iOS Debug Unsigned IPA (\`${ipa_name}\`, bundle \`com.nuvio.app.z.debug\`, display name \`Nuvio Z Debug\`)

          Installs as \`com.nuvio.app.z.debug\` side-by-side with stable Nuvio Z.
          Signed with the committed debug keystore for Android; unsigned IPA for SideStore sideloading on iOS.

          Not a release. The stable updater ignores prereleases."

          echo "Published ${{ needs.prepare.outputs.tag }}"

      - name: Update SideStore debug source feed
        run: |
          set -euo pipefail
          ipa_name="Nuvio-Z-iOS-${{ needs.prepare.outputs.marketing_version }}-${{ needs.prepare.outputs.debug_build }}-debug-unsigned.ipa"
          notes_file="${RUNNER_TEMP}/debug-notes.txt"
          echo "Debug build ${{ needs.prepare.outputs.version }} (build ${{ needs.prepare.outputs.debug_build }}) for SideStore." > "${notes_file}"

          canonical_dir="${RUNNER_TEMP}/canonical-main"
          rm -rf "${canonical_dir}"
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${canonical_dir}"

          python3 scripts/update-store-source.py \
            --source "${canonical_dir}/distribution/sidestore/source-debug.json" \
            --ipa "release-assets/${ipa_name}" \
            --expected-bundle-id com.nuvio.app.z.debug \
            --release-notes "${notes_file}" \
            --release-version "${{ needs.prepare.outputs.version }}" \
            --release-date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.prepare.outputs.tag }}/${ipa_name}"

          if git -C "${canonical_dir}" status --porcelain | grep -q "source\.json"; then
            echo "::error::Stable source.json was unexpectedly modified by debug release" >&2
            exit 1
          fi

          if git -C "${canonical_dir}" diff --quiet "${canonical_dir}/distribution/sidestore/source-debug.json"; then
            echo "Canonical source-debug.json on main is already current."
          else
            git -C "${canonical_dir}" config user.name "github-actions[bot]"
            git -C "${canonical_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "${canonical_dir}" add distribution/sidestore/source-debug.json
            git -C "${canonical_dir}" commit -m "chore(store): update source-debug.json for ${{ needs.prepare.outputs.version }} [skip ci]"

            pushed=0
            for attempt in 1 2 3; do
              if git -C "${canonical_dir}" push origin main; then
                pushed=1
                break
              fi
              echo "Push to main failed (attempt ${attempt}/3). Re-fetching latest main..."
              sleep 2
              git -C "${canonical_dir}" pull --rebase origin main
            done

            if [[ "${pushed}" -ne 1 ]]; then
              echo "::error::Failed to push canonical source-debug.json to main after 3 attempts" >&2
              exit 1
            fi
          fi

          cp "${canonical_dir}/distribution/sidestore/source-debug.json" distribution/sidestore/source-debug.json
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            distribution/sidestore/source-debug.json \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
